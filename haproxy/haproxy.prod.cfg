# Roteador interno da stack de PRODUÇÃO (docker-compose.prod.yml). Não termina TLS: quem faz isso é o proxy
# do servidor (Traefik / Nginx Proxy Manager / Caddy), que fala com este contêiner pela rede externa "proxy".
#
#   /api/*     -> convenios-api   (:8080)   /api/docs fica bloqueado
#   /storage/* -> convenios-minio (:9000)   prefixo removido (URLs pré-assinadas)
#   demais     -> convenios-web   (:3000)   inclui /bff/* e /auth/*
#
# Os nomes têm o prefixo "convenios-" de propósito: este contêiner também está na rede do proxy, compartilhada com
# outras stacks, e um serviço chamado só "api" ou "web" de outra stack responderia ao mesmo nome DNS.

global
    log stdout format raw local0
    maxconn 2048

defaults
    mode http
    log global
    option httplog
    # Sem "option forwardfor": o proxy do servidor já informa o cliente em X-Forwarded-For; acrescentar o IP dele
    # faria a API enxergá-lo como cliente. Veja a regra de X-Forwarded-For no frontend.
    option http-server-close
    option dontlognull
    timeout connect 5s
    timeout client  5m
    timeout server  60s
    timeout http-request 15s
    timeout http-keep-alive 10s

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s

frontend http_in
    bind *:80

    # Verificação de saúde do próprio contêiner (healthcheck do compose); não vai para os logs.
    monitor-uri /healthz

    # O proxy do servidor informa o esquema real (https). Só assume http se o cabeçalho faltar.
    http-request set-header X-Forwarded-Proto http unless { req.hdr(X-Forwarded-Proto) -m found }
    http-request set-header X-Forwarded-Host %[req.hdr(host)] unless { req.hdr(X-Forwarded-Host) -m found }
    # Sem X-Forwarded-For (proxy que não o envia) a API enxergaria o IP deste contêiner e todos dividiriam o mesmo
    # limite de requisições. Com o cabeçalho presente, ele passa intacto.
    http-request add-header X-Forwarded-For %[src] unless { req.hdr(X-Forwarded-For) -m found }

    # Documentação da API: não exposta em produção.
    http-request deny deny_status 404 if { path -i /api/docs } || { path_beg -i /api/docs/ }

    acl is_api path_beg /api/
    acl is_api path /api
    acl is_storage path_beg /storage/

    # O roteamento é decidido antes da reescrita do caminho (os ACLs são avaliados no momento do uso).
    http-request set-var(txn.route) str(api) if is_api
    http-request set-var(txn.route) str(storage) if is_storage
    acl route_api var(txn.route) -m str api
    acl route_storage var(txn.route) -m str storage

    # Remove o prefixo antes do MinIO: a URL pré-assinada é calculada sobre /<bucket>/<objeto> e o Host original
    # (SigV4 inclui ambos). O Host não pode ser alterado.
    http-request replace-path ^/storage/(.*) /\1 if route_storage

    use_backend api if route_api
    use_backend minio_s3 if route_storage
    default_backend web

backend api
    option httpchk
    http-check send meth GET uri /api/health
    http-check expect status 200
    server api convenios-api:8080 check resolvers docker init-addr libc,none

backend web
    option httpchk
    http-check send meth GET uri /auth/sign-in
    http-check expect status 200
    server web convenios-web:3000 check resolvers docker init-addr libc,none

backend minio_s3
    # Envios e downloads de até 200 MB: tempo maior de resposta do servidor.
    timeout server 10m
    option httpchk
    http-check send meth GET uri /minio/health/live ver HTTP/1.1 hdr Host convenios-minio
    http-check expect status 200
    server minio convenios-minio:9000 check resolvers docker init-addr libc,none
